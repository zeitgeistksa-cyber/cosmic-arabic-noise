name: Storm Watch

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:          # also allow manual trigger

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy

      - name: Poll NOAA for Kp
        id: poll
        run: |
          python << 'PY'
import json, urllib.request, os, time
from pathlib import Path

url = "https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json"
try:
    req = urllib.request.Request(url, headers={"User-Agent": "storm-watch/1.0"})
    with urllib.request.urlopen(req, timeout=15) as r:
        data = json.loads(r.read())
    latest = data[-1]
    kp = float(latest[1]) if latest[1] not in (None, "null", "") else 0
    time_tag = latest[0]
except Exception as e:
    print(f"!! poll failed: {e}")
    kp = 0
    time_tag = "unknown"

record = {
    "ts": time.time(),
    "time_tag": time_tag,
    "kp": kp,
    "source": "github_actions",
}
Path("cloud_kp.jsonl").parent.mkdir(parents=True, exist_ok=True)
with open("cloud_kp.jsonl", "a") as fp:
    fp.write(json.dumps(record) + "\n")
print(f"Kp = {kp} at {time_tag}")
print(f"::set-output name=kp::{kp}")
PY

      - name: Commit if changed
        run: |
          git config user.name "storm-watch-bot"
          git config user.email "storm-watch@localhost"
          git add cloud_kp.jsonl
          git diff --staged --quiet || git commit -m "Storm watch: Kp=$(tail -1 cloud_kp.jsonl | python -c 'import sys,json; print(json.load(sys.stdin)["kp"])')"
          git push
