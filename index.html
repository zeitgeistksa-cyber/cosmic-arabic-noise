<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cosmic Arabic Noise — Live</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --bg:#0a0a0f; --fg:#e8e8f0; --dim:#777; --hot:#ff5e5e; --cool:#5ee7ff; }
  body { background:var(--bg); color:var(--fg); font-family:ui-monospace,Menlo,monospace;
         margin:0; padding:2rem; line-height:1.5; }
  h1 { font-size:1.1rem; letter-spacing:.2em; text-transform:uppercase; color:var(--cool); }
  .row { display:flex; gap:2rem; flex-wrap:wrap; margin-top:1.5rem; }
  .col { flex:1; min-width:260px; }
  .label { color:var(--dim); font-size:.75rem; text-transform:uppercase;
           letter-spacing:.15em; margin-bottom:.4rem; }
  .val { font-size:1.6rem; margin-bottom:1rem; }
  table { width:100%; border-collapse:collapse; font-size:.85rem; }
  td { padding:.25rem .5rem; border-bottom:1px solid #1a1a25; }
  .root { color:var(--hot); font-weight:bold; font-size:1.1em; }
  .sim { color:var(--cool); }
  .dim { color:var(--dim); }
</style>
</head>
<body>
<h1>Cosmic Arabic Noise — Live Snapshot</h1>
<p class="dim" id="gen">loading…</p>

<div class="row">
  <div class="col">
    <div class="label">Turns</div><div class="val" id="turns">—</div>
    <div class="label">Distinct Roots</div><div class="val" id="roots">—</div>
    <div class="label">Last Cosmic</div><div id="cosmic" class="dim">—</div>
  </div>
  <div class="col">
    <div class="label">Top Roots (recent)</div>
    <table id="top"><tbody></tbody></table>
  </div>
  <div class="col">
    <div class="label">Recent Utterances</div>
    <table id="recent"><tbody></tbody></table>
  </div>
</div>

<script>
async function load() {
  const r = await fetch('snapshot.json?_=' + Date.now());
  const d = await r.json();
  document.getElementById('gen').textContent = 'generated ' + d.generated_at;
  const L = d.latest || {};
  document.getElementById('turns').textContent = L.turns_total ?? '—';
  document.getElementById('roots').textContent = L.distinct_roots ?? '—';
  document.getElementById('cosmic').textContent =
    JSON.stringify(L.last_cosmic || {}, null, 2);

  const top = document.querySelector('#top tbody');
  top.innerHTML = (L.top_roots || []).map(([r, n]) =>
    `<tr><td class="root">${r}</td><td class="dim">×${n}</td></tr>`).join('');

  const recent = document.querySelector('#recent tbody');
  recent.innerHTML = (L.recent_turns || []).reverse().map(t =>
    `<tr><td class="dim">${t.turn}</td>` +
    `<td class="root">${t.root}</td>` +
    `<td class="sim">${t.sim}</td></tr>`).join('');
}
load();
setInterval(load, 30000);
</script>
</body>
</html>
